<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Yandex DataLens Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 16px;
    }

    .dashboard-wrapper {
      width: 100%;
      height: 850px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Аналитический дашборд</h1>

    <div class="dashboard-wrapper">
      <iframe
        src="https://datalens.yandex/qc0dut8n0ul4a?_no_controls=1"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</body>
</html>
